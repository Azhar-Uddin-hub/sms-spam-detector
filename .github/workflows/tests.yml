name: Project checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sms-spam-detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: sms-spam-detector/requirements*.txt
      - run: python -m pip install -r requirements-lock.txt -r requirements-dev.txt
      - run: python -m pytest -q
